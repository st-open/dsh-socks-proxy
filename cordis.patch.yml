# Outbound proxy for DSH (SOCKS5 / HTTP / HTTPS). Override `config` from your profile's
# cordis.patch.yml with an entry `- id: socks-proxy` (see README.md).
- insert:
    - id: socks-proxy
      name: '@st-open/dsh-socks-proxy'
      config:
        schema: 2
        # Three proxy slots; a filled slot switches its traffic on, empty = not used.
        #   dshProxy:    DSH itself (web search / fetch, MCP, terminal commands)
        #   llmProxy:    LLM API requests
        #   globalProxy: default for whichever of the two has no slot of its own
        # socks5h:// lets the proxy resolve DNS; socks5:// resolves locally.
        # Installed dormant: configure the real proxy on the Plugins page.
        dshProxy: ''
        llmProxy: ''
        globalProxy: ''
