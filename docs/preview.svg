<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="SOCKS5 代理配置页界面示意">
  <style>
    text { font-family: -apple-system, "Segoe UI", "PingFang SC", Helvetica, Arial, sans-serif; }
    .muted { fill: #8a919b; }
    .body { fill: #363c44; }
    .label { fill: #5b6470; font-size: 13px; }
  </style>
  <rect width="960" height="640" fill="#eef0f3"/>
  <rect x="60" y="40" width="840" height="560" rx="16" fill="#ffffff" stroke="#e2e5e9"/>

  <text x="92" y="86" font-size="22" font-weight="600" fill="#1f2328">代理（SOCKS5 / HTTP）</text>
  <text x="92" y="112" font-size="13" class="muted">让 DSH 的出站流量走 SOCKS5 / HTTP 代理，保存后立即生效。</text>
  <line x1="92" y1="134" x2="868" y2="134" stroke="#eef0f3"/>

  <!-- mode -->
  <text x="92" y="168" class="label">代理模式</text>
  <rect x="92" y="182" width="220" height="38" rx="9" fill="#f2f4f7"/>
  <text x="202" y="206" text-anchor="middle" font-size="13" class="muted">关闭</text>
  <rect x="316" y="182" width="220" height="38" rx="9" fill="#eaf0ff" stroke="#4d6bfe"/>
  <text x="426" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#2b4cff">仅大模型 API</text>
  <rect x="540" y="182" width="220" height="38" rx="9" fill="#f2f4f7"/>
  <text x="650" y="206" text-anchor="middle" font-size="13" class="muted">全部流量</text>

  <!-- proxy input -->
  <text x="92" y="262" class="label">代理服务器</text>
  <rect x="92" y="276" width="776" height="44" rx="10" fill="#ffffff" stroke="#d9dde3"/>
  <text x="110" y="303" font-size="14" fill="#363c44">socks5h://127.0.0.1:7890</text>
  <text x="852" y="303" text-anchor="end" font-size="12" class="muted">粘贴地址或命令</text>

  <!-- bypass private -->
  <rect x="94" y="342" width="18" height="18" rx="4" fill="#4d6bfe"/>
  <path d="M98 351l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124" y="356" font-size="13" class="body">局域网地址直连（10.x / 172.16–31.x / 192.168.x）</text>

  <!-- extra hosts -->
  <text x="92" y="398" class="label">额外的代理主机（可选）</text>
  <rect x="92" y="412" width="776" height="40" rx="10" fill="#ffffff" stroke="#d9dde3"/>
  <text x="110" y="437" font-size="13" class="muted">corp.example.com, 10.0.0.8</text>

  <!-- buttons -->
  <rect x="92" y="474" width="132" height="40" rx="10" fill="#ffffff" stroke="#d9dde3"/>
  <text x="158" y="499" text-anchor="middle" font-size="13" class="body">测试连接</text>
  <rect x="236" y="474" width="100" height="40" rx="10" fill="#4d6bfe"/>
  <text x="286" y="499" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">保存</text>

  <!-- result -->
  <text x="356" y="499" font-size="13" fill="#1a9c66">✓ 代理连通 · TCP 12 ms · 握手 8 ms</text>

  <!-- endpoints -->
  <text x="92" y="548" class="label">模型接口连通性</text>
  <text x="92" y="576" font-size="13" class="body">wb 网关</text>
  <text x="640" y="576" font-size="13" fill="#1a9c66">✓ 直连</text>

  <text x="900" y="588" text-anchor="end" font-size="11" fill="#aab1ba">界面示意 · 非真实截图</text>
</svg>
